<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntropy - Behavioral Study</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TLVMYV7MCB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TLVMYV7MCB', { 'debug_mode': true });
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400&family=Roboto:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --g-blue: #4285F4; --g-red: #EA4335; --g-yellow: #FBBC05; --g-green: #34A853;
        }

        body { 
            background: #ffffff; color: #202124; font-family: 'Roboto', sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; text-align: center;
        }

        /* The Syntropy "Logo" */
        .logo {
            font-family: 'Product Sans', Arial, sans-serif;
            font-size: 80px; font-weight: 400; letter-spacing: -2px; margin-bottom: 5px;
        }
        .logo span:nth-child(1) { color: var(--g-blue); }
        .logo span:nth-child(2) { color: var(--g-red); }
        .logo span:nth-child(3) { color: var(--g-yellow); }
        .logo span:nth-child(4) { color: var(--g-blue); }
        .logo span:nth-child(5) { color: var(--g-green); }
        .logo span:nth-child(6) { color: var(--g-red); }
        .logo span:nth-child(7) { color: var(--g-blue); }
        .logo span:nth-child(8) { color: var(--g-yellow); }

        .tagline { font-size: 20px; font-weight: 300; color: #5f6368; margin-bottom: 5px; }
        .sub-tagline { font-size: 16px; color: #70757a; margin-bottom: 30px; }
        .micro-tag { font-size: 10px; color: #dadce0; text-transform: uppercase; margin-top: 50px; }

        .btn-row { display: flex; gap: 15px; }

        button {
            height: 40px; padding: 0 20px; border-radius: 4px; border: 1px solid transparent;
            font-size: 14px; cursor: pointer; transition: 0.2s; background: #f8f9fa; color: #3c4043;
        }

        /* The Rebellious Button */
        .btn-rebel {
            background: var(--g-red); color: white; border: none; font-weight: bold;
            animation: pulse 1.5s infinite;
        }
        .btn-rebel:hover { transform: scale(1.1); box-shadow: 0 4px 15px rgba(234, 67, 53, 0.4); }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(234, 67, 53, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(234, 67, 53, 0); }
            100% { box-shadow: 0 0 0 0 rgba(234, 67, 53, 0); }
        }

        button:not(.btn-rebel):hover { border-color: #dadce0; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="logo">
        <span>S</span><span>y</span><span>n</span><span>t</span><span>r</span><span>o</span><span>p</span><span>y</span>
    </div>
    
    <div class="tagline">Extracting order from chaos</div>
    <div class="sub-tagline">Everything is data</div>

    <div class="btn-row">
        <button onclick="record('Obedient_Click')">Click Here</button>
        <button class="btn-rebel" onclick="record('Rebellious_Click')">DONT CLICK HERE</button>
    </div>

    <div class="micro-tag">data is everything</div>

    <script>
        function record(action) {
            gtag('event', action, { 'event_category': 'Syntropy_Experiment_V1' });
            alert(action === 'Rebellious_Click' ? "Order disrupted. Data extracted." : "Path followed. Data recorded.");
        }
    </script>
</body>
</html>
