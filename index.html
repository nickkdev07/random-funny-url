<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntropy - Behavioral Study</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TLVMYV7MCB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TLVMYV7MCB', { 'debug_mode': true });
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --g-blue: #4285F4; --g-red: #EA4335; --g-yellow: #FBBC05; --g-green: #34A853;
        }

        body { 
            background: #ffffff; color: #202124; font-family: 'Roboto', sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; text-align: center;
        }

        /* The Syntropy Logo */
        .logo {
            font-family: 'Product Sans', Arial, sans-serif;
            font-size: 88px; font-weight: 400; letter-spacing: -2.5px; margin-bottom: 8px;
        }
        .logo span:nth-child(1) { color: var(--g-blue); }
        .logo span:nth-child(2) { color: var(--g-red); }
        .logo span:nth-child(3) { color: var(--g-yellow); }
        .logo span:nth-child(4) { color: var(--g-blue); }
        .logo span:nth-child(5) { color: var(--g-green); }
        .logo span:nth-child(6) { color: var(--g-red); }
        .logo span:nth-child(7) { color: var(--g-blue); }
        .logo span:nth-child(8) { color: var(--g-yellow); }

        .tagline { font-size: 24px; font-weight: 300; color: #5f6368; margin-bottom: 40px; }
        .provocation { font-size: 15px; color: #3c4043; font-style: italic; margin-bottom: 20px; opacity: 0.8; }

        .btn-row { display: flex; gap: 12px; margin-bottom: 100px; }

        button {
            height: 44px; padding: 0 24px; border-radius: 4px; border: 1px solid transparent;
            font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; 
            background: #f8f9fa; color: #3c4043;
        }

        button:not(.btn-rebel):hover { 
            border-color: #dadce0; 
            box-shadow: 0 1px 2px rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15); 
        }

        .btn-rebel { background: var(--g-red); color: white; border: none; animation: pulse 2s infinite; }
        .btn-rebel:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(234, 67, 53, 0.5); }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(234, 67, 53, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(234, 67, 53, 0); }
            100% { box-shadow: 0 0 0 0 rgba(234, 67, 53, 0); }
        }

        /* The Recursive Footer Logic */
        .footer-recursive {
            position: absolute; bottom: 50px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Roboto', sans-serif;
            color: #bdc1c6; /* Visible but subtle gray */
        }

        .left-text { font-size: 20px; font-weight: 300; margin-right: 10px; }
        .center-data { font-size: 32px; font-weight: 500; color: #70757a; text-transform: uppercase; letter-spacing: 2px; }
        .right-text { font-size: 20px; font-weight: 300; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="logo">
        <span>S</span><span>y</span><span>n</span><span>t</span><span>r</span><span>o</span><span>p</span><span>y</span>
    </div>
    
    <div class="tagline">Extracting order from chaos</div>

    <div class="provocation">Choice is yours... or not?</div>

    <div class="btn-row">
        <button onclick="record('Obedient_Path')">Click Here</button>
        <button class="btn-rebel" onclick="record('Rebellious_Path')">DONT CLICK HERE</button>
    </div>

    <div class="footer-recursive">
        <span class="left-text">everything is</span>
        <span class="center-data">data</span>
        <span class="right-text">is everything</span>
    </div>

    <script>
        function record(action) {
            gtag('event', action, { 'event_category': 'Behavioral_Flow' });
            alert(action === 'Rebellious_Path' ? "Order disrupted." : "Path followed.");
        }
    </script>
</body>
</html>
