<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Experiment #742</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TLVMYV7MCB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TLVMYV7MCB', { 'debug_mode': true });
    </script>

    <style>
        :root {
            --goog-blue: #4285F4;
            --goog-red: #EA4335;
            --goog-yellow: #FBBC05;
            --goog-green: #34A853;
            --gray-100: #f8f9fa;
            --gray-300: #dadce0;
        }

        body { 
            background: #ffffff; 
            color: #202124; 
            font-family: 'Roboto', Arial, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0;
        }

        .experiment-container {
            text-align: center;
            padding: 24px;
            width: 100%;
            max-width: 600px;
        }

        .logo {
            font-size: 48px;
            font-weight: 500;
            margin-bottom: 30px;
            letter-spacing: -1.5px;
        }

        /* Coloring the "Random Funny Website Name" like the Google Logo */
        .logo span:nth-child(1) { color: var(--goog-blue); }
        .logo span:nth-child(2) { color: var(--goog-red); }
        .logo span:nth-child(3) { color: var(--goog-yellow); }
        .logo span:nth-child(4) { color: var(--goog-blue); }
        .logo span:nth-child(5) { color: var(--goog-green); }
        .logo span:nth-child(6) { color: var(--goog-red); }

        .search-box-mimic {
            border: 1px solid var(--gray-300);
            border-radius: 24px;
            padding: 12px 20px;
            margin-bottom: 24px;
            box-shadow: none;
            transition: box-shadow 0.2s;
            color: #5f6368;
        }
        .search-box-mimic:hover {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            background-color: var(--gray-100);
            border: 1px solid var(--gray-100);
            border-radius: 4px;
            color: #3c4043;
            font-family: 'Roboto', arial, sans-serif;
            font-size: 14px;
            margin: 11px 4px;
            padding: 0 16px;
            line-height: 27px;
            height: 36px;
            min-width: 54px;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }

        button:hover {
            border: 1px solid var(--gray-300);
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            color: #202124;
        }

        /* Specific styles for the experiment buttons */
        .btn-forbidden:hover { border-color: var(--goog-red); color: var(--goog-red); }
        .btn-safe:hover { border-color: var(--goog-blue); color: var(--goog-blue); }

    </style>
</head>
<body>

    <div class="experiment-container">
        <div class="logo">
            <span>R</span><span>a</span><span>n</span><span>d</span><span>o</span><span>m</span>
        </div>
        
        <div class="search-box-mimic">
            Social Experiment #742: Choose a path...
        </div>

        <div class="btn-row">
            <button class="btn-safe" onclick="logAction('Choice_Click_Here')">Click Here</button>
            <button class="btn-forbidden" onclick="logAction('Choice_Dont_Click')">Dont Click Here</button>
        </div>
    </div>

    <script>
        function logAction(type) {
            gtag('event', type, {
                'event_category': 'behavioral_testing',
                'event_label': 'Google_Aesthetic_V1'
            });
            
            if (type.includes('Dont')) {
                alert("Choice: Chaotic. This event has been sent to your Google Ads conversion stream.");
            } else {
                alert("Choice: Standard. This event has been logged in Google Analytics.");
            }
        }
    </script>
</body>
</html>
