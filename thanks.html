<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntropy - Thank You</title>
    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #ffffff; color: #202124; font-family: 'Roboto', sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; text-align: center; overflow: hidden;
        }
        
        h1 { font-family: 'Product Sans', sans-serif; font-size: 36px; color: #4285F4; margin-bottom: 10px; }
        p { color: #5f6368; font-size: 18px; max-width: 500px; line-height: 1.6; }
        
        /* Consistent Geometric Footer */
        .footer-recursive {
            position: absolute; bottom: 50px;
            display: flex; align-items: flex-end; justify-content: center;
            height: 50px;
        }
        .left-text { font-size: 18px; font-weight: 300; color: #bdc1c6; margin-right: 15px; align-self: flex-start; line-height: 1; margin-top: 10px; }
        .center-data { font-size: 44px; font-weight: 500; color: #70757a; text-transform: uppercase; letter-spacing: 4px; line-height: 1; }
        .right-text { font-size: 18px; font-weight: 300; color: #bdc1c6; margin-left: 15px; align-self: flex-end; line-height: 1; margin-bottom: 2px; }
    </style>
</head>
<body>

    <h1>Audit Complete</h1>
    <p>Thank you for participating in this social survey.</p>

    <div class="footer-recursive">
        <span class="left-text">everything is</span>
        <span class="center-data">DATA</span>
        <span class="right-text">is everything</span>
    </div>

</body>
</html>
